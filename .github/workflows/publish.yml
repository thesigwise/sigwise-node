# Generated by generate-sdk; edit internal/sdkgen/templates/node/publish.yml.tmpl
# in the API repository instead.
#
# Publishes the package to npm whenever main carries a version that npm does not
# have yet: merging an "Update the node SDK" pull request is the release.
#
# Authenticates with npm trusted publishing (OIDC), so there is no token to
# store. On npmjs.com, under the package's Settings → Trusted Publisher, add
# GitHub Actions with repository thesigwise/sigwise-node and workflow publish.yml.
# npm only offers that once the package exists, so publish the first version
# by hand: npm publish
name: Publish to npm

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # the release tag
      id-token: write # trusted publishing and provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest

      - name: Check whether this version is on npm
        id: check
        run: |
          name=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already published"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.publish == 'true'
        run: npm install
      - if: steps.check.outputs.publish == 'true'
        run: npm publish --provenance --access public

      - name: Tag the release
        if: steps.check.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: v${{ steps.check.outputs.version }}
        run: gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --generate-notes
